name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'Folderly/Backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Folderly/Backend/**'
      - '.github/workflows/ci.yml'

# A second push to the same branch makes the first one irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.14' # The Dockerfile's python is 3.14-slim
  WORKDIR: Folderly/Backend

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: Folderly/Backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  smoke:
    name: Smoke test the built image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the smoke test's dependencies
        run: pip install requests

      - name: Build the image
        run: docker build -t folderly-backend:ci Folderly/Backend

      - name: Start the container
        run: |
          mkdir -p /tmp/folderly/files /tmp/folderly/db
          docker run -d --name folderly \
            -p 5000:5000 \
            -e DISK_PATH=/data \
            -e DB_DIR=/db \
            -e JWT_SECRET_KEY="$(openssl rand -hex 32)" \
            -v /tmp/folderly/files:/data \
            -v /tmp/folderly/db:/db \
            folderly-backend:ci

      - name: Wait for it to answer
        run: |
          for attempt in $(seq 30); do
            if curl -fsS http://localhost:5000/hello >/dev/null; then
              echo "up after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "the container never answered:" && docker logs folderly && exit 1

      - name: Mint an activation code
        id: code
        run: |
          output=$(docker exec folderly flask --app "app:init()" codes new --label ci)
          code=$(echo "$output" | grep -oE '[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}-[A-Z2-9]{4}')
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Walk an account through the app
        run: python Folderly/Backend/tests/smoke.py http://localhost:5000 ${{ steps.code.outputs.code }}

      - name: Container logs
        if: always()
        run: docker logs folderly

  # Two architectures, each built on its own native runner — no QEMU, so both
  # take the same couple of minutes. Neither job tags the image: each pushes an
  # untagged build and reports its digest, and the merge job below binds the two
  # digests under one tag. Tagging here instead would have the two jobs race,
  # with whichever finished last leaving `latest` pointing at one architecture.
  publish:
    name: Build ${{ matrix.platform }}
    needs: [test, smoke]
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Work out the image name and a filename-safe platform
        id: names
        # GHCR rejects capitals, which a GitHub username may contain, and an
        # artifact name cannot hold the slash in "linux/amd64".
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/folderly-backend" >> "$GITHUB_OUTPUT"
          platform=${{ matrix.platform }}
          echo "slug=${platform//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # built in

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: Folderly/Backend
          platforms: ${{ matrix.platform }}
          # Links the package to this repository on GitHub
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.names.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.slug }}

      - name: Hand the digest to the merge job
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.names.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Tag both architectures as one image
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/folderly-backend" >> "$GITHUB_OUTPUT"

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        # A manifest list means `docker pull` serves each host its own
        # architecture from the same tag, with no per-host configuration.
        run: |
          docker buildx imagetools create \
            --tag ${{ steps.image.outputs.name }}:latest \
            --tag ${{ steps.image.outputs.name }}:sha-${{ github.sha }} \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            docker buildx imagetools inspect ${{ steps.image.outputs.name }}:latest
            echo '```'
            echo ""
            echo "Tags: \`latest\`, \`sha-${{ github.sha }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
