version: 2
updates:
  - package-ecosystem: pip
    directory: /Folderly/Backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /Folderly/Frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The base images of both Dockerfiles: python, node and caddy.
  - package-ecosystem: docker
    directories:
      - /Folderly/Backend
      - /Folderly/Frontend
    schedule:
      interval: weekly
